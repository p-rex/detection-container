name: Container Build

permissions:
  contents: read
  packages: write
  security-events: write  # SARIF アップロードに必要

on:
  workflow_dispatch:  # 手動実行
  push:
    branches:
      - main
  pull_request:
    branches:
      - main


jobs:
  build:
    name: Build and Push Image
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

    # -------------------------------------------------------
    # FCS IaC スキャン: Dockerfile のセキュリティチェック
    # ビルド前に実行し、問題を早期検出する
    # FCS CLI 2.2.0+ の仕様: SARIF を含む複数フォーマット出力時は
    # output_path をディレクトリパスにする必要がある
    # -------------------------------------------------------
    - name: FCS IaC Scan (Dockerfile)
      id: fcs-iac
      uses: crowdstrike/fcs-action@v4.0.1
      with:
        falcon_client_id: ${{ vars.FALCON_CLIENT_ID }}
        falcon_region: 'us-1'
        scan_type: iac
        path: './Dockerfile'
        platforms: 'Dockerfile'
        severities: 'critical,high,medium'
        report_formats: 'sarif'
        output_path: './fcs-iac-results/'
        project_name: '${{ github.repository }}/${{ github.ref_name }}'
      env:
        FALCON_CLIENT_SECRET: ${{ secrets.FALCON_CLIENT_SECRET }}

    - name: Find IaC SARIF report file
      id: find-iac-sarif
      if: always() && steps.fcs-iac.outcome != 'skipped'
      run: |
        SARIF_FILE=$(find ./fcs-iac-results/ -name "*.sarif" 2>/dev/null | head -1)
        if [ -z "$SARIF_FILE" ]; then
          echo "No SARIF file found in ./fcs-iac-results/"
          echo "found=false" >> "$GITHUB_OUTPUT"
        else
          echo "Found SARIF: $SARIF_FILE"
          echo "path=$SARIF_FILE" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload Dockerfile scan SARIF to GitHub Code Scanning
      uses: github/codeql-action/upload-sarif@v3
      if: always() && steps.find-iac-sarif.outputs.found == 'true'
      with:
        sarif_file: ${{ steps.find-iac-sarif.outputs.path }}
        category: fcs-iac-dockerfile

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=sha,format=short
          type=ref,event=branch
          latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # -------------------------------------------------------
    # FCS イメージスキャン: ビルドしたコンテナイメージの脆弱性スキャン
    # ビルド後に実行する
    # イメージスキャンの output_path はファイルパスで指定する必要がある
    # .sarif を指定すると内部で .json に変換して実行後、SARIF に変換する
    # -------------------------------------------------------
    - name: FCS Image Scan
      id: fcs-image
      continue-on-error: true
      uses: crowdstrike/fcs-action@v4.0.1
      with:
        falcon_client_id: ${{ vars.FALCON_CLIENT_ID }}
        falcon_region: 'us-1'
        scan_type: image
        image: ghcr.io/${{ github.repository }}:latest
        report_formats: 'sarif'
        output_path: './fcs-image-results.sarif'
        upload_results: 'true'
      env:
        FALCON_CLIENT_SECRET: ${{ secrets.FALCON_CLIENT_SECRET }}

    - name: Check generated files after image scan
      if: always() && steps.fcs-image.outcome != 'skipped'
      run: |
        echo "=== FCS Image Scan exit code: ${{ steps.fcs-image.outputs.exit-code }} ==="
        echo "=== Files in workspace root ==="
        ls -la ./fcs-image-results* 2>/dev/null || echo "No fcs-image-results* files found"
        echo "=== All SARIF files ==="
        find . -name "*.sarif" 2>/dev/null || echo "No SARIF files found"
        echo "=== All JSON files in root ==="
        find . -maxdepth 1 -name "*.json" 2>/dev/null || echo "No JSON files found in root"

    - name: Upload image scan SARIF to GitHub Code Scanning
      uses: github/codeql-action/upload-sarif@v3
      if: always() && steps.fcs-image.outcome != 'skipped'
      with:
        sarif_file: './fcs-image-results.sarif'
        category: fcs-image-scan
